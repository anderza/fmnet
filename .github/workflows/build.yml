name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Собрать APK
        env:
          RADIONET_STORE_PASSWORD: ${{ secrets.RADIONET_STORE_PASSWORD }}
          RADIONET_KEY_ALIAS: ${{ secrets.RADIONET_KEY_ALIAS }}
          RADIONET_KEY_PASSWORD: ${{ secrets.RADIONET_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk "RadioNet-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RadioNet-1.0.${{ github.run_number }}
          path: RadioNet-*.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RadioNet 1.0.${{ github.run_number }}
          make_latest: true
          files: RadioNet-*.apk
          body: |
            Радиоплеер RadioNet для Android-смартфонов и Android TV (Android 5.0 и новее).
            Скачайте `RadioNet-1.0.${{ github.run_number }}.apk` ниже и установите его на устройство.
