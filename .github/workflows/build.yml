name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d /tmp/ct && mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "SDK: $ANDROID_HOME, sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"

      - name: Собрать APK
        env:
          RADIONET_STORE_PASSWORD: ${{ secrets.RADIONET_STORE_PASSWORD }}
          RADIONET_KEY_ALIAS: ${{ secrets.RADIONET_KEY_ALIAS }}
          RADIONET_KEY_PASSWORD: ${{ secrets.RADIONET_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk "RadioNet-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RadioNet-1.0.${{ github.run_number }}
          path: RadioNet-*.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RadioNet 1.0.${{ github.run_number }}
          make_latest: true
          files: RadioNet-*.apk
          body: |
            Радиоплеер RadioNet для Android-смартфонов и Android TV (Android 5.0 и новее).
            Скачайте `RadioNet-1.0.${{ github.run_number }}.apk` ниже и установите его на устройство.
